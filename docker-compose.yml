services:
  web:
    image: ghcr.io/example/quant-web:latest
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"

  api:
    image: ghcr.io/example/quant-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"

  worker:
    image: ghcr.io/example/quant-worker:latest
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis-data:
